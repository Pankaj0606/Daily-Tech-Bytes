name: Daily Tech Byte Push

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST daily
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Environment and Credentials
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

    - name: Run Tech Byte Generator
      run: python scripts/daily_tech_byte.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "Pankaj0606"
        git config --global user.email "96838709+Pankaj0606@users.noreply.github.com"
        
        git add .
        if git diff --staged --quiet; then
          echo "No new tech bytes generated today."
        else
          git commit -m "feat(tech-byte): auto-publish daily concept [skip ci]"
          git push origin main
        fi